name: Deploy Astro to Cloudflare
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-astro.yml']
permissions:
  contents: read
concurrency:
  group: cap-vision-astro-production
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    defaults:
      run:
        working-directory: apps/cap-vision-astro
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/cap-vision-astro/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck:public
      - run: npm run build
      - name: Verify generated Worker target
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('dist/wrangler.json')); if(c.name!=='cap-vision-institute'||c.main!=='./server/entry.mjs') throw Error('Unexpected Worker target');"
      - name: Deploy the Astro Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'Set CLOUDFLARE_API_TOKEN in production environment or repository secrets.'
            exit 1
          fi
          npx --no-install wrangler deploy --config dist/wrangler.json
      - name: Configure Course Advisor provider when key is available
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            printf '%s' "$GEMINI_API_KEY" | npx --no-install wrangler secret put GEMINI_API_KEY --config dist/wrangler.json
          else
            echo 'No repository Gemini key supplied; existing Worker secret is preserved. Basic course guidance remains available.'
          fi
      - name: Verify public homepage changed
        run: node scripts/verify-live-theme.mjs https://capvisionpartner.com --attempts=6
      - name: Verify shared design on internal pages
        run: node scripts/verify-project-theme.mjs https://capvisionpartner.com
      - name: Diagnose Course Advisor provider
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const origin='https://capvisionpartner.com';
          const config=await fetch(origin+'/api/course-advisor').then(r=>r.json());
          console.log('Advisor configuration:',JSON.stringify(config));
          const key=process.env.GEMINI_API_KEY;
          if(key){
            const {advise,validateInput}=await import('./src/lib/course-advisor.mjs');
            const result=await advise(validateInput({message:'แนะนำหลักสูตรพัฒนาการสื่อสาร',history:[]}),{apiKey:key,fetcher:async(url,init)=>{
              const response=await fetch(url,init);
              if(!response.ok){
                const error=await response.clone().json().catch(()=>({}));
                console.log('Provider diagnosis:',JSON.stringify({status:response.status,code:error.error?.status,message:String(error.error?.message||'').replaceAll(key,'[redacted]').slice(0,700)}));
              }
              return response;
            }});
            console.log('Direct provider response mode:',result.mode);
          }
          NODE
