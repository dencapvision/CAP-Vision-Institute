name: Deploy Astro to Cloudflare
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-astro.yml']
permissions:
  contents: read
concurrency:
  group: cap-vision-astro-production
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    defaults:
      run:
        working-directory: apps/cap-vision-astro
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/cap-vision-astro/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck:admin
      - run: npm run typecheck:public
      - run: npm run build
      - name: Verify generated Worker target
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('dist/wrangler.json')); if(c.name!=='cap-vision-institute'||c.main!=='./server/entry.mjs') throw Error('Unexpected Worker target');"
      - name: Deploy the Astro Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'Set CLOUDFLARE_API_TOKEN in production environment or repository secrets.'
            exit 1
          fi
          for attempt in 1 2 3; do
            if npx --no-install wrangler deploy --config dist/wrangler.json; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
      - name: Configure Course Advisor provider when key is available
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -n "$DEEPSEEK_API_KEY" ]; then
            for attempt in 1 2 3; do
              if printf '%s' "$DEEPSEEK_API_KEY" | npx --no-install wrangler secret put DEEPSEEK_API_KEY --config dist/wrangler.json; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
            done
          else
            echo 'No repository DeepSeek key supplied; existing Worker secret is preserved. Basic course guidance remains available.'
          fi
      - name: Verify public homepage changed
        run: node scripts/verify-live-theme.mjs https://capvisionpartner.com --attempts=6
      - name: Verify shared design on internal pages
        run: node scripts/verify-project-theme.mjs https://capvisionpartner.com
      - name: Verify live DeepSeek Course Advisor
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/verify-course-advisor.mjs https://capvisionpartner.com
      - name: Verify guarded Admin routes
        run: node scripts/verify-admin-release.mjs https://capvisionpartner.com
