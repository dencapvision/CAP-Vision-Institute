name: Admin database diagnostics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-astro.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Read-only database availability
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          console.log('Available database access:',JSON.stringify({managementToken:!!process.env.SUPABASE_ACCESS_TOKEN,databaseUrl:!!process.env.SUPABASE_DB_URL,databasePassword:!!process.env.SUPABASE_DB_PASSWORD}));
          const source=fs.readFileSync('apps/cap-vision-astro/src/lib/supabase.ts','utf8');
          const key=source.match(/'eyJ[^']+'/)?.[0].slice(1,-1);
          if(!key)throw Error('Public API key unavailable');
          for(const [table,select] of [['crm_admins','user_id'],['leads','pipeline_stage,follow_up_at,crm_notes'],['profiles','is_admin'],['blog_articles','id'],['articles','id'],['courses','id'],['events','id'],['instructors','id'],['media','id']]){
            const response=await fetch('https://nheppvjayzxlblkeanxs.supabase.co/rest/v1/'+table+'?select='+select+'&limit=0',{headers:{apikey:key,Authorization:'Bearer '+key}});
            let body={};try{body=await response.json();}catch{}
            console.log('Schema probe:',JSON.stringify({table,status:response.status,code:body.code||null}));
          }
          NODE
