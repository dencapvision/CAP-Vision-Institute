name: Legacy VPS deploy (manual)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger server deploy via webhook
        run: |
          curl --fail-with-body -X POST https://capvisionpartner.com/webhook/deploy \
            -H "Content-Type: application/json" \
            -d '{"ref":"refs/heads/main"}' \
            --max-time 20
