name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger server deploy via webhook
        run: |
          curl -X POST https://capvisionpartner.com/webhook/deploy \
            -H "Content-Type: application/json" \
            -d '{"ref":"refs/heads/main"}' \
            --max-time 10 || true
