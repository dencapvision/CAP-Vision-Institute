server {
    listen 80;
    server_name admin.capvisionpartner.com;

    # Redirect HTTP to HTTPS (optional but recommended once SSL is set up)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Error handling
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}

# Note: After applying this, run 'certbot --nginx -d admin.capvisionpartner.com' 
# to enable SSL (HTTPS) automatically.
